
name: Python Dependency Check

on:
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - '.github/workflows/dependency-check.yaml'

  pull_request:
    branches: [main]
    paths:
      - 'requirements.txt'
      - '.github/workflows/dependency-check.yaml'

  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify requirements file
        run: |
          python -m pip --version
          python -c "from pathlib import Path; assert Path('requirements.txt').is_file(), 'File not found'; print('requirements.txt found successfully')"