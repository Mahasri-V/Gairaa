
services:
  spark:
    build: .
    container_name: pyspark_etl
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    command: tail -f /dev/null
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: pyspark_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-employee_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-employee_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
